name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - run: ./gradlew build
      - name: Check tag matches plugin version
        run: |
          version=$(sed -n 's/^version=//p' runelite-plugin.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in runelite-plugin.properties"
            exit 1
          fi
      - name: Open or update the Plugin Hub pull request
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_HUB_TOKEN }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: scripts/submit-to-plugin-hub.sh
